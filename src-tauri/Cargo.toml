[package]
name = "archagon"
version = "0.1.0"
description = "Native local development server manager for Arch Linux"
authors = ["Archagon"]
license = "MIT"
edition = "2021"

[lib]
name = "archagon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
