[package]
name = "archagon"
version = "0.1.0"
description = "Native local development server manager for Arch Linux"
authors = ["Archagon"]
license = "MIT"
edition = "2021"

[lib]
name = "archagon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Wajib untuk build produksi. Tanpa ini Tauri menganggap build sebagai mode dev
# dan memuat devUrl (http://127.0.0.1:1420) alih-alih aset UI yang di-embed.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
